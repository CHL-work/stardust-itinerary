name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The github.com release-download URL was returning gateway errors, so fetch the pinned release
          # through the REST API with the job's own token (gh first, then curl with retries by asset id),
          # and run it only if it matches the published checksum.
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          if ! gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --dir "$RUNNER_TEMP"; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$archive" \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058
          fi
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stardust_test_ci
          POSTGRES_USER: stardust
          POSTGRES_PASSWORD: stardust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stardust -d stardust_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TEST_DATABASE_URL: postgresql://stardust:stardust@localhost:5432/stardust_test_ci
          TEST_DATABASE_CONFIRM_DESTROY: stardust_test_ci
        run: pnpm check

      - name: Verify portable PostgreSQL dump and restore
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" dropdb --if-exists -U stardust stardust_restore
          docker exec "$container_id" createdb -U stardust stardust_restore
          docker exec "$container_id" pg_dump \
            --format=plain --no-owner --no-privileges \
            -U stardust -f /tmp/stardust.sql stardust_test_ci
          docker exec "$container_id" psql \
            -v ON_ERROR_STOP=1 -U stardust -d stardust_restore \
            -f /tmp/stardust.sql
          table_count="$(docker exec "$container_id" psql \
            -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'" \
            -U stardust -d stardust_restore)"
          test "$table_count" -ge 15
