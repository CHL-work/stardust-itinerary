name: Deploy

# Continuous deployment: when CI passes for a push to main, this workflow builds the container image
# for that commit (tagged with its SHA) and deploys it. Run it manually ("Run workflow" on main) to
# redeploy, or to roll back to an earlier revision of main. The deploy job runs in the "production"
# environment, which only main may use; it is the only identity that can obtain cluster credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA on main to deploy (defaults to the head of main)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/stardust-itinerary-live/stardust/stardust-itinerary
  WORKLOAD_IDENTITY_PROVIDER: projects/207089361723/locations/global/workloadIdentityPools/github/providers/stardust-itinerary

jobs:
  image:
    # Only a successful CI run for a push to main of this repository deploys. A pull request from a
    # fork can name its branch "main", so the CI run's event and repository are checked as well.
    if: >-
      github.repository == 'CHL-work/stardust-itinerary' && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve revision
        id: revision
        # Only commits that are on main deploy, so a manual run cannot ship an unmerged commit.
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "revision is not on main" >&2; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (image builder)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: image-builder@stardust-itinerary-live.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Skip when the image already exists
        id: existing
        run: |
          if gcloud artifacts docker images describe "$IMAGE:${{ steps.revision.outputs.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Configure Artifact Registry
        if: steps.existing.outputs.found != 'true'
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.revision.outputs.sha }}
          build-args: STARDUST_BUILD_VERSION=${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    environment: production
    # One deploy at a time; a newer request waits instead of cancelling one in progress.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image.outputs.revision }}

      - name: Authenticate to Google Cloud (deployer)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@stardust-itinerary-live.iam.gserviceaccount.com

      - name: Get cluster credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: stardust
          location: ${{ env.REGION }}

      - name: Deploy
        run: bash deploy/deploy.sh "${{ needs.image.outputs.revision }}"
