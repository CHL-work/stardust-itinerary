# Self-hosting with Docker Compose: PostgreSQL 17, a one-off migration, the web app and the
# background scheduler (disruption checks and feedback). Routine checks paid by members' own keys run in
# the web app, the only service that decrypts them (JOB-094). See docs/SELF_HOSTING.md.
name: stardust

x-app-database: &app-database
  DATABASE_URL: postgresql://stardust:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/stardust

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: stardust
      POSTGRES_USER: stardust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stardust -d stardust"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: stardust-itinerary:local
    command: ["migrate"]
    env_file: .env
    environment:
      <<: *app-database
      DATABASE_DIRECT_URL: postgresql://stardust:${POSTGRES_PASSWORD}@db:5432/stardust
      # Only the web server decrypts users' saved AI keys.
      CREDENTIAL_ENCRYPTION_KEY: ""
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ""
      CREDENTIAL_KMS_KEY: ""
      CREDENTIAL_KMS_SERVICE_ACCOUNT: ""
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: stardust-itinerary:local
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-database
      STARDUST_MAP_CACHE_DIR: /home/stardust/day-map-cache
      ROUTINE_CHECKS_ENABLED: ${ROUTINE_CHECKS_ENABLED:-true}
    ports:
      - "${STARDUST_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: stardust-itinerary:local
    command: ["scheduler"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-database
      # Only the web server decrypts users' saved AI keys.
      CREDENTIAL_ENCRYPTION_KEY: ""
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ""
      CREDENTIAL_KMS_KEY: ""
      CREDENTIAL_KMS_SERVICE_ACCOUNT: ""
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
