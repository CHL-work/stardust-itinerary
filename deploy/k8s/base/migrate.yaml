# Never runs on a schedule (suspended). The deploy script starts it once per release with
#   kubectl create job stardust-migrate-<revision> --from=cronjob/stardust-migrate
# It applies pending migrations as the administrator, then refreshes the runtime role's grants.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-migrate
  labels:
    app.kubernetes.io/component: migrate
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: migrate
        spec:
          serviceAccountName: stardust-migrate
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: migrate
              image: stardust-itinerary
              args: ["migrate"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: STARDUST_DB_ADMIN_PASSWORD_FILE
                  value: /var/run/stardust/db/password
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app-env
                  mountPath: /var/run/stardust/env/app
                  readOnly: true
                - name: db-admin
                  mountPath: /var/run/stardust/db
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: app-env
              secret:
                secretName: stardust-app-env
            - name: db-admin
              secret:
                secretName: stardust-db-admin
                items:
                  - key: password
                    path: password
            - name: tmp
              emptyDir: {}
