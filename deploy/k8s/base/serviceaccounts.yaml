# One identity per workload, so each can be granted only the secrets it needs.
# None of them may call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-db
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-backup
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stardust-tunnel
automountServiceAccountToken: false
