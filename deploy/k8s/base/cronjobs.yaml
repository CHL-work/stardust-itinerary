# Background work. The disruption monitor wakes every 5 minutes (PostgreSQL holds the real
# 30-minute due gate); the feedback worker runs hourly; the encrypted backup and the off-site copy
# run daily.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-disruption
  labels:
    app.kubernetes.io/component: disruption
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: disruption
        spec:
          serviceAccountName: stardust-worker
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: disruption
              image: stardust-itinerary
              args: ["disruption"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app-env
                  mountPath: /var/run/stardust/env/app
                  readOnly: true
                - name: ai-env
                  mountPath: /var/run/stardust/env/ai
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/stardust
          volumes:
            - name: app-env
              secret:
                secretName: stardust-app-env
            - name: ai-env
              secret:
                secretName: stardust-ai-env
                optional: true
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-feedback
  labels:
    app.kubernetes.io/component: feedback
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: feedback
        spec:
          # The reviewer reads user-written text, so this job never holds the GitHub token; publishing
          # is the separate stardust-feedback-publish job.
          serviceAccountName: stardust-worker
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: feedback
              image: stardust-itinerary
              args: ["feedback"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app-env
                  mountPath: /var/run/stardust/env/app
                  readOnly: true
                - name: ai-env
                  mountPath: /var/run/stardust/env/ai
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/stardust
          volumes:
            - name: app-env
              secret:
                secretName: stardust-app-env
            - name: ai-env
              secret:
                secretName: stardust-ai-env
                optional: true
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
---
# Publishing reviewed issues: the GitHub token and the database, with no model and no AI keys.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-feedback-publish
  labels:
    app.kubernetes.io/component: feedback-publish
spec:
  schedule: "47 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: feedback-publish
        spec:
          # Its own identity: only this job may read the feedback repository token.
          serviceAccountName: stardust-feedback
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: feedback-publish
              image: stardust-itinerary
              args: ["feedback"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: TMPDIR
                  value: /tmp
                # Publishing only: overrides the app secret's setting, so no model runs here.
                - name: STARDUST_FEEDBACK_TRIAGE_ENABLED
                  value: "false"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app-env
                  mountPath: /var/run/stardust/env/app
                  readOnly: true
                - name: feedback-env
                  mountPath: /var/run/stardust/env/feedback
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: app-env
              secret:
                secretName: stardust-app-env
            - name: feedback-env
              secret:
                secretName: stardust-feedback-env
                optional: true
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-backup
  labels:
    app.kubernetes.io/component: backup
spec:
  schedule: "30 18 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: stardust-backup
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: stardust-itinerary
              args: ["backup", "--label=scheduled"]
              envFrom:
                - configMapRef:
                    name: stardust-backup-config
              env:
                - name: STARDUST_DB_ADMIN_PASSWORD_FILE
                  value: /var/run/stardust/db/password
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                  ephemeral-storage: 2Gi
                limits:
                  memory: 1Gi
                  ephemeral-storage: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db-admin
                  mountPath: /var/run/stardust/db
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: db-admin
              secret:
                secretName: stardust-db-admin
                items:
                  - key: password
                    path: password
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
---
# Daily off-site copy (D-083): restores the database into a second PostgreSQL server as a dated,
# row-count-verified database and keeps the newest copies. It does nothing until the
# stardust-offsite-env secret provides STARDUST_OFFSITE_DATABASE_URL.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-offsite-copy
  labels:
    app.kubernetes.io/component: offsite-copy
spec:
  schedule: "0 19 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: offsite-copy
        spec:
          # Its own identity: the administrator password plus the off-site connection, nothing else.
          serviceAccountName: stardust-offsite-copy
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: offsite-copy
              image: stardust-itinerary
              args: ["offsite-copy"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: STARDUST_DB_ADMIN_PASSWORD_FILE
                  value: /var/run/stardust/db/password
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  memory: 512Mi
                  ephemeral-storage: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db-admin
                  mountPath: /var/run/stardust/db
                  readOnly: true
                - name: offsite-env
                  mountPath: /var/run/stardust/env/offsite
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: db-admin
              secret:
                secretName: stardust-db-admin
                items:
                  - key: password
                    path: password
            - name: offsite-env
              secret:
                secretName: stardust-offsite-env
                optional: true
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
---
# Hourly: permanently delete guest accounts whose 24 hours are over (JOB-064). Needs only the
# database: no AI keys, no internet (see the guest-purge-egress NetworkPolicy).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-guest-purge
  labels:
    app.kubernetes.io/component: guest-purge
spec:
  schedule: "41 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: guest-purge
        spec:
          # Its own identity: the purge suspends triggers, which needs the database administrator,
          # so this job gets the administrator password and nothing else (no app or AI secrets).
          serviceAccountName: stardust-guest-purge
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: guest-purge
              image: stardust-itinerary
              args: ["guest-purge"]
              env:
                - name: STARDUST_ENV_DIR
                  value: /var/run/stardust/env
                - name: STARDUST_DB_ADMIN_PASSWORD_FILE
                  value: /var/run/stardust/db/password
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db-admin
                  mountPath: /var/run/stardust/db
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/stardust
          volumes:
            - name: db-admin
              secret:
                secretName: stardust-db-admin
                items:
                  - key: password
                    path: password
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
