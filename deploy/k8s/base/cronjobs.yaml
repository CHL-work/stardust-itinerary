---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-backup
  labels:
    app.kubernetes.io/component: backup
spec:
  schedule: "30 18 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stardust-itinerary
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: stardust-backup
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: stardust-itinerary
              args: ["backup", "--label=scheduled"]
              envFrom:
                - configMapRef:
                    name: stardust-backup-config
              env:
                - name: STARDUST_DB_ADMIN_PASSWORD_FILE
                  value: /var/run/stardust/db/password
                - name: TMPDIR
                  value: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                  ephemeral-storage: 2Gi
                limits:
                  memory: 1Gi
                  ephemeral-storage: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db-admin
                  mountPath: /var/run/stardust/db
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: db-admin
              secret:
                secretName: stardust-db-admin
                items:
                  - key: password
                    path: password
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
