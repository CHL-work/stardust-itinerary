# PostgreSQL 17 for a small instance: one replica on a persistent disk, backed up by the
# stardust-backup CronJob. The administrator password is a file from the stardust-db-admin secret.
apiVersion: v1
kind: Service
metadata:
  name: stardust-db
  labels:
    app.kubernetes.io/component: db
spec:
  selector:
    app.kubernetes.io/name: stardust-itinerary
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stardust-db
  labels:
    app.kubernetes.io/component: db
spec:
  serviceName: stardust-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stardust-itinerary
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stardust-itinerary
        app.kubernetes.io/component: db
    spec:
      serviceAccountName: stardust-db
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-bookworm
          args:
            - -c
            - max_connections=60
            - -c
            - shared_buffers=128MB
            - -c
            - password_encryption=scram-sha-256
          env:
            - name: POSTGRES_DB
              value: stardust
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/stardust/db/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "stardust", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "stardust", "-h", "127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-admin
              mountPath: /var/run/stardust/db
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-admin
          secret:
            secretName: stardust-db-admin
            items:
              - key: password
                path: password
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
