# The web server may reach the GKE metadata server for its Kubernetes identity's token, which it
# uses only to act as the service account that seals users' AI keys with Cloud KMS (JOB-069). The
# base app-egress policy keeps every other pod away from the metadata server. Ports as documented
# for Workload Identity Federation for GKE, including GKE Dataplane V2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-metadata-egress
  namespace: stardust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - port: 988
          protocol: TCP
