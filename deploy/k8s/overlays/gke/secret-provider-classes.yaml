# Google Secret Manager secrets, mounted as files by the GKE Secret Manager add-on. Each pod's
# Kubernetes service account is granted access to only its own secrets (see infra/main.tf).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stardust-app-env
  namespace: stardust
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/stardust-itinerary-live/secrets/stardust-app-env/versions/latest"
        path: "app.env"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stardust-ai-env
  namespace: stardust
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/stardust-itinerary-live/secrets/stardust-ai-env/versions/latest"
        path: "ai.env"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stardust-db-admin
  namespace: stardust
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/stardust-itinerary-live/secrets/stardust-db-admin-password/versions/latest"
        path: "password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stardust-tunnel
  namespace: stardust
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/stardust-itinerary-live/secrets/stardust-tunnel-credentials/versions/latest"
        path: "credentials.json"
