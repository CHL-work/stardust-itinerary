apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stardust-db
  namespace: stardust
spec:
  template:
    spec:
      volumes:
        - name: db-admin
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: stardust-db-admin
