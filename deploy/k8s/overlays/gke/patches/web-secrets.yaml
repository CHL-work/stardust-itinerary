apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardust-web
  namespace: stardust
spec:
  template:
    spec:
      volumes:
        - name: app-env
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: stardust-app-env
        - name: ai-env
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: stardust-ai-env
        - name: credential-env
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: stardust-credential-env
