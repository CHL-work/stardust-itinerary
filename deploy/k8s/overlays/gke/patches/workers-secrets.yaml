apiVersion: batch/v1
kind: CronJob
metadata:
  name: stardust-disruption
  namespace: stardust
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: app-env
              secret: null
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: stardust-app-env
            - name: ai-env
              secret: null
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: stardust-ai-env
---
