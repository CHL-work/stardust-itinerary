apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardust-tunnel
  namespace: stardust
spec:
  template:
    spec:
      volumes:
        - name: credentials
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: stardust-tunnel
